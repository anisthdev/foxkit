<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>foxkit</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f4f4f7;
    --fg: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --accent: #e0244a;
    --accent-fg: #ffffff;
    --ok: #1d9a56;
    --warn: #b7791f;
    --error: #d93025;
    --error-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c20;
      --surface: #26262b;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --line: #34343a;
      --accent: #ff4f6d;
      --ok: #3fbf7f;
      --warn: #e0a640;
      --error: #ff7b72;
      --error-bg: #3a2123;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 340px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; }

  /* On/off switch */
  .switch { position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    width: 30px; height: 18px; border-radius: 9px; background: var(--line);
    position: relative; transition: background .15s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0003; transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track::after { transform: translateX(12px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { padding: 14px; }

  .empty { text-align: center; padding: 18px 8px; color: var(--muted); }
  .empty strong { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; }

  .card { display: flex; gap: 12px; }
  .poster {
    flex: none; width: 68px; height: 102px; border-radius: 6px; object-fit: cover;
    background: var(--surface); border: 1px solid var(--line);
  }
  .details { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .show { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .episode { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source { color: var(--muted); font-size: 12px; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; margin-top: auto; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.watching { color: var(--ok); }
  .status.paused { color: var(--warn); }
  .status.off, .status.stopped { color: var(--muted); }
  .status.error { color: var(--error); }

  .progress { margin-top: 12px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); transition: width .4s; }
  .bar.done div { background: var(--ok); }
  .progress-label { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--muted); }

  .alert { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--error-bg); color: var(--error); font-size: 12px; }

  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 6px 12px;
  }
  button:hover { background: var(--surface); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; width: 100%; padding: 8px; }
  button.primary:hover { filter: brightness(1.08); }
  button.link { border: 0; padding: 0; background: none; color: var(--muted); font-size: 12px; }
  button.link:hover { color: var(--fg); text-decoration: underline; }

  .fix { margin-top: 12px; }

  .picker { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .picker form { display: flex; gap: 6px; }
  .picker input {
    flex: 1; min-width: 0; font: inherit; color: inherit; padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  }
  .picker input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .results button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 0; padding: 5px 6px; border-radius: 6px;
  }
  .results img, .results .thumb {
    flex: none; width: 28px; height: 42px; border-radius: 3px; object-fit: cover; background: var(--surface);
  }
  .results .year { color: var(--muted); }
  .results .note { padding: 8px 6px; color: var(--muted); }

  .signin p { margin: 0 0 12px; color: var(--muted); }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  footer a { color: var(--fg); font-weight: 500; }
</style>
</head>
<body>
  <header>
    <h1>Trakt scrobbler</h1>
    <label class="switch" id="toggle" hidden title="Scrobble Netflix playback">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>

  <main>
    <div id="signed-out" class="signin" hidden>
      <p>Connect your Trakt account to scrobble what you watch on Netflix automatically.</p>
      <button id="login" class="primary">Connect Trakt</button>
    </div>

    <div id="idle" class="empty" hidden>
      <strong>Nothing playing</strong>
      Start something on Netflix and it will show up here.
    </div>

    <div id="playing" hidden>
      <div class="card">
        <img class="poster" id="poster" alt="" hidden>
        <div class="poster" id="poster-blank"></div>
        <div class="details">
          <a class="show" id="show" target="_blank"></a>
          <div class="episode" id="episode"></div>
          <div class="source" id="source"></div>
          <div class="status" id="status"></div>
        </div>
      </div>

      <div class="progress">
        <div class="bar" id="bar"><div id="bar-fill"></div></div>
        <div class="progress-label">
          <span id="percent"></span>
          <span id="hint"></span>
        </div>
      </div>

      <div class="alert" id="error" hidden></div>

      <div class="fix"><button class="link" id="fix">Wrong match?</button></div>
      <div class="picker" id="picker" hidden>
        <form id="search">
          <input type="search" id="query" placeholder="Search Trakt">
          <button>Search</button>
        </form>
        <ul class="results" id="results"></ul>
      </div>
    </div>
  </main>

  <footer id="account" hidden>
    <span>Signed in as <a id="username" target="_blank"></a></span>
    <button class="link" id="logout">Sign out</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
